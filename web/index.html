<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102a43">
  <title>VestCare - Deteksi Rintangan</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f3f6f9; color: #172b4d; }
    body { max-width: 720px; margin: auto; padding: 18px; }
    h1 { margin-bottom: 4px; }
    .card { background: white; border-radius: 14px; padding: 16px; margin: 14px 0; box-shadow: 0 2px 12px #102a4314; }
    label { display: block; font-weight: 650; margin: 12px 0 6px; }
    input, button { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #bcccdc; border-radius: 10px; font: inherit; }
    button { border: 0; background: #087e8b; color: white; font-weight: 700; margin-top: 12px; }
    button:disabled { opacity: .55; }
    video, img { width: 100%; max-height: 55vh; object-fit: contain; background: #102a43; border-radius: 10px; }
    .muted { color: #52667a; font-size: .92rem; }
    .status { padding: 10px; border-radius: 8px; background: #e6f6f7; }
    .error { background: #fff0ef; color: #9c2c20; }
    .item { border-top: 1px solid #d9e2ec; padding: 10px 0; }
    .urgent { font-size: 1.15rem; font-weight: 750; }
    .sound { background: #f0f8f9; border-left: 4px solid #087e8b; padding: 10px; margin-top: 10px; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>VestCare</h1>
  <div class="muted">Deteksi kamera -> fuzzy urgency -> suara Ardi otomatis sesuai tingkat bahaya.</div>
  <section class="card">
    <label for="distance">Jarak sensor ultrasonik (meter, opsional)</label>
    <input id="distance" type="number" min="0.03" max="3" step="0.01" placeholder="Kosongkan jika tanpa sensor">
    <video id="camera" autoplay playsinline muted></video>
    <button id="start">Aktifkan kamera belakang</button>
    <button id="testAudio" type="button">Tes suara Ardi</button>
    <button id="capture" disabled>Deteksi dan putar suara Ardi</button>
    <button id="repeatAudio" type="button" disabled>Putar ulang suara terakhir</button>
    <div class="muted">Halaman ini membuat sesi aman otomatis, jadi Anda tidak perlu memasukkan API key. Tekan Tes suara Ardi sekali dan pastikan volume ponsel aktif.</div>
  </section>
  <section class="card">
    <div id="status" class="status" role="status">Aktifkan kamera, lalu tekan tombol deteksi.</div>
    <div id="result"></div>
  </section>
  <script>
    const distance = document.querySelector("#distance");
    const camera = document.querySelector("#camera");
    const startButton = document.querySelector("#start");
    const testAudioButton = document.querySelector("#testAudio");
    const captureButton = document.querySelector("#capture");
    const repeatAudioButton = document.querySelector("#repeatAudio");
    const statusBox = document.querySelector("#status");
    const resultBox = document.querySelector("#result");

    const silentWav = "data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YSADAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==";
    const audio = new Audio();
    audio.preload = "auto";

    let stream;
    let lastPlan = null;
    let audioUnlocked = false;
    let audioToken = 0;

    function setStatus(message, failed = false) {
      statusBox.textContent = message;
      statusBox.classList.toggle("error", failed);
    }

    async function unlockAudio() {
      if (audioUnlocked) return;
      try {
        audio.src = silentWav;
        await audio.play();
        audio.pause();
        audio.currentTime = 0;
        audioUnlocked = true;
      } catch (error) {
        // Beberapa browser baru mengizinkan audio setelah tombol ditekan lagi.
      }
    }

    function stopAudio() {
      audioToken += 1;
      audio.pause();
      audio.removeAttribute("src");
      audio.load();
    }

    function playUrl(url) {
      return new Promise((resolve, reject) => {
        function bersihkan() {
          audio.removeEventListener("ended", selesai);
          audio.removeEventListener("error", gagal);
        }
        function selesai() {
          bersihkan();
          resolve();
        }
        function gagal() {
          bersihkan();
          reject(new Error("berkas suara tidak dapat diputar"));
        }
        audio.addEventListener("ended", selesai);
        audio.addEventListener("error", gagal);
        audio.src = url;
        const promise = audio.play();
        if (promise) promise.catch(error => {
          bersihkan();
          reject(error);
        });
      });
    }

    async function playPlan(plan, { test = false } = {}) {
      if (!plan || !Array.isArray(plan.segmen) || !plan.segmen.length) {
        setStatus("Klip suara Ardi tidak tersedia untuk hasil ini.", true);
        return;
      }
      stopAudio();
      const token = audioToken;
      setStatus(test
        ? "Memutar contoh suara Ardi..."
        : `Memutar peringatan ${plan.level} dengan suara Ardi...`);
      try {
        for (const segmen of plan.segmen) {
          if (token !== audioToken) return;
          await playUrl(segmen.url);
        }
        if (token !== audioToken) return;
        setStatus(test
          ? "Tes suara Ardi selesai. Suara siap dipakai."
          : `Peringatan ${plan.level} selesai diputar.`);
      } catch (error) {
        if (token !== audioToken) return;
        setStatus(`Suara gagal diputar: ${error.message}. Tekan Tes suara Ardi lalu coba lagi.`, true);
      }
    }

    function renderResult(body) {
      const detections = body.deteksi || [];
      resultBox.replaceChildren();
      const heading = document.createElement("div");
      heading.className = "urgent";
      heading.textContent = `${body.level_tertinggi} - urgensi ${body.urgensi_tertinggi}/100`;
      resultBox.append(heading);
      if (body.suara && body.suara.teks) {
        const sound = document.createElement("div");
        sound.className = "sound";
        sound.textContent = `Suara Ardi: ${body.suara.teks}`;
        resultBox.append(sound);
      }
      if (!detections.length) {
        const item = document.createElement("p");
        item.textContent = "Tidak ada rintangan yang terdeteksi.";
        resultBox.append(item);
      }
      for (const detection of detections) {
        const item = document.createElement("div");
        item.className = "item";
        item.textContent = `${detection.level} | ${detection.kelas} ${detection.arah} | ${Number(detection.jarak_m).toFixed(1)} m | confidence ${Math.round(detection.conf * 100)}%`;
        resultBox.append(item);
      }
    }

    startButton.addEventListener("click", async () => {
      void unlockAudio();
      try {
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error("Browser perlu HTTPS dan izin kamera.");
        }
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } }, audio: false
        });
        camera.srcObject = stream;
        await camera.play();
        captureButton.disabled = false;
        setStatus("Kamera aktif. Arahkan ke jalur di depan, lalu tekan deteksi.");
      } catch (error) {
        setStatus(`Kamera tidak dapat dibuka: ${error.message}`, true);
      }
    });

    testAudioButton.addEventListener("click", async () => {
      testAudioButton.disabled = true;
      try {
        await unlockAudio();
        setStatus("Mengambil contoh suara Ardi...");
        const response = await fetch("/suara/pratinjau");
        const body = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(body.detail || `HTTP ${response.status}`);
        await playPlan(body.suara, { test: true });
      } catch (error) {
        setStatus(`Tes suara gagal: ${error.message}`, true);
      } finally {
        testAudioButton.disabled = false;
      }
    });

    repeatAudioButton.addEventListener("click", () => {
      void unlockAudio();
      if (lastPlan) playPlan(lastPlan);
    });

    captureButton.addEventListener("click", async () => {
      if (!camera.videoWidth || !camera.videoHeight) {
        setStatus("Menunggu kamera siap. Coba lagi.", true);
        return;
      }
      captureButton.disabled = true;
      setStatus("Menganalisis gambar...");
      try {
        const maxWidth = 1280;
        const scale = Math.min(1, maxWidth / camera.videoWidth);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(camera.videoWidth * scale);
        canvas.height = Math.round(camera.videoHeight * scale);
        canvas.getContext("2d").drawImage(camera, 0, 0, canvas.width, canvas.height);
        const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", 0.86));
        if (!blob) throw new Error("Gagal mengambil gambar dari kamera.");
        const form = new FormData();
        form.append("gambar", blob, "kamera.jpg");
        if (distance.value !== "") form.append("jarak_m", distance.value);
        const response = await fetch("/deteksi", { method: "POST", body: form });
        const body = await response.json().catch(() => ({}));
        if (response.status === 401) {
          setStatus("Sesi web kedaluwarsa. Memuat ulang halaman...", true);
          setTimeout(() => location.reload(), 1200);
          return;
        }
        if (!response.ok) throw new Error(body.detail || `HTTP ${response.status}`);
        renderResult(body);
        lastPlan = body.suara || null;
        repeatAudioButton.disabled = !lastPlan;
        if (lastPlan) {
          void playPlan(lastPlan);
        } else {
          setStatus("Deteksi selesai, tetapi klip suara Ardi tidak tersedia.", true);
        }
      } catch (error) {
        setStatus(`Deteksi gagal: ${error.message}`, true);
      } finally {
        captureButton.disabled = false;
      }
    });

    window.addEventListener("pagehide", () => stream?.getTracks().forEach(track => track.stop()));
  </script>
</body>
</html>
