<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102a43">
  <title>VestCare - Deteksi Rintangan</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f3f6f9; color: #172b4d; }
    body { max-width: 720px; margin: auto; padding: 18px; }
    h1 { margin-bottom: 4px; }
    .card { background: white; border-radius: 14px; padding: 16px; margin: 14px 0; box-shadow: 0 2px 12px #102a4314; }
    button { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #bcccdc; border-radius: 10px; font: inherit; }
    button { border: 0; background: #087e8b; color: white; font-weight: 700; margin-top: 12px; }
    button:disabled { opacity: .55; }
    .camera { position: relative; overflow: hidden; border-radius: 10px; background: #102a43; }
    video { display: block; width: 100%; max-height: 65vh; object-fit: contain; }
    #boxes { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .muted { color: #52667a; font-size: .92rem; }
    .status { padding: 10px; border-radius: 8px; background: #e6f6f7; }
    .error { background: #fff0ef; color: #9c2c20; }
    .item { border-top: 1px solid #d9e2ec; padding: 10px 0; }
    .urgent { font-size: 1.15rem; font-weight: 750; }
    .sound { background: #f0f8f9; border-left: 4px solid #087e8b; padding: 10px; margin-top: 10px; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>VestCare</h1>
  <div class="muted">Kamera mendeteksi rintangan otomatis, menampilkan kotak objek, dan memberi peringatan suara.</div>
  <section class="card">
    <div class="camera">
      <video id="camera" autoplay playsinline muted></video>
      <canvas id="boxes" aria-hidden="true"></canvas>
    </div>
    <button id="start">Aktifkan kamera belakang</button>
    <div class="muted">Tekan aktifkan kamera sekali. Deteksi dan peringatan suara berjalan otomatis selama kamera aktif.</div>
  </section>
  <section class="card">
    <div id="status" class="status" role="status">Aktifkan kamera, lalu tekan tombol deteksi.</div>
    <div id="result"></div>
  </section>
  <script>
    const camera = document.querySelector("#camera");
    const boxes = document.querySelector("#boxes");
    const boxContext = boxes.getContext("2d");
    const startButton = document.querySelector("#start");
    const statusBox = document.querySelector("#status");
    const resultBox = document.querySelector("#result");

    const silentWav = "data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YSADAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==";
    const audio = new Audio();
    audio.preload = "auto";

    let stream;
    let audioUnlocked = false;
    let audioToken = 0;
    let detecting = false;
    let cameraSession = 0;
    let alertKey = null;
    let alertLevel = 0;
    let lastAlertAt = 0;
    let lastSpokenAt = 0;
    const detectionIntervalMs = 100;

    function setStatus(message, failed = false) {
      statusBox.textContent = message;
      statusBox.classList.toggle("error", failed);
    }

    async function unlockAudio() {
      if (audioUnlocked) return;
      audio.src = silentWav;
      await audio.play();
      audio.pause();
      audio.currentTime = 0;
      audio.removeAttribute("src");
      audio.load();
      audioUnlocked = true;
    }

    function stopAudio() {
      audioToken += 1;
      audio.pause();
      audio.removeAttribute("src");
      audio.load();
    }

    function playUrl(url) {
      return new Promise((resolve, reject) => {
        function bersihkan() {
          audio.removeEventListener("ended", selesai);
          audio.removeEventListener("error", gagal);
        }
        function selesai() {
          bersihkan();
          resolve();
        }
        function gagal() {
          bersihkan();
          reject(new Error("berkas suara tidak dapat diputar"));
        }
        audio.addEventListener("ended", selesai);
        audio.addEventListener("error", gagal);
        audio.src = url;
        const promise = audio.play();
        if (promise) promise.catch(error => {
          bersihkan();
          reject(error);
        });
      });
    }

    async function playPlan(plan) {
      if (!plan || !Array.isArray(plan.segmen) || !plan.segmen.length) {
        setStatus("Klip suara Ardi tidak tersedia untuk hasil ini.", true);
        return;
      }
      stopAudio();
      const token = audioToken;
      setStatus(`Memutar instruksi ${plan.level} dengan suara Ardi...`);
      try {
        for (const segmen of plan.segmen) {
          if (token !== audioToken) return;
          await playUrl(segmen.url);
        }
        if (token !== audioToken) return;
        setStatus(`Instruksi ${plan.level} selesai diputar.`);
      } catch (error) {
        if (token !== audioToken) return;
        setStatus(`Suara gagal diputar: ${error.message}. Periksa volume dan izin audio browser.`, true);
      }
    }

    function renderBoxes(detections) {
      const width = camera.clientWidth;
      const height = camera.clientHeight;
      const ratio = window.devicePixelRatio || 1;
      boxes.width = Math.round(width * ratio);
      boxes.height = Math.round(height * ratio);
      boxContext.setTransform(ratio, 0, 0, ratio, 0, 0);
      boxContext.clearRect(0, 0, width, height);
      boxContext.font = "600 14px system-ui, sans-serif";
      boxContext.lineWidth = 3;

      for (const detection of detections) {
        const [left, top, right, bottom] = detection.bbox || [];
        if (![left, top, right, bottom].every(Number.isFinite)) continue;
        const x = left * width;
        const y = top * height;
        const boxWidth = (right - left) * width;
        const boxHeight = (bottom - top) * height;
        const color = detection.level === "BAHAYA" ? "#ff4055"
          : detection.level === "WASPADA" ? "#ffbd35"
          : detection.level === "INFO" ? "#46dd91" : "#31c7e8";
        const label = `${detection.kelas} | ${detection.level} | ${Number(detection.jarak_m).toFixed(1)} m`;
        const labelWidth = boxContext.measureText(label).width + 12;
        const labelY = Math.max(0, y - 25);
        boxContext.strokeStyle = color;
        boxContext.strokeRect(x, y, boxWidth, boxHeight);
        boxContext.fillStyle = color;
        boxContext.fillRect(x, labelY, labelWidth, 24);
        boxContext.fillStyle = "#102a43";
        boxContext.fillText(label, x + 6, labelY + 17);
      }
    }

    function renderResult(body) {
      const detections = body.deteksi || [];
      renderBoxes(detections);
      resultBox.replaceChildren();
      const heading = document.createElement("div");
      heading.className = "urgent";
      heading.textContent = `${body.level_tertinggi} - urgensi ${body.urgensi_tertinggi}/100`;
      resultBox.append(heading);
      if (body.suara && body.suara.teks) {
        const sound = document.createElement("div");
        sound.className = "sound";
        sound.textContent = `Instruksi dan solusi suara Ardi: ${body.suara.teks}`;
        resultBox.append(sound);
      }
      if (!detections.length) {
        const item = document.createElement("p");
        item.textContent = "Tidak ada rintangan yang terdeteksi.";
        resultBox.append(item);
      }
      for (const detection of detections) {
        const item = document.createElement("div");
        item.className = "item";
        item.textContent = `${detection.level} | ${detection.kelas} ${detection.arah} | ${Number(detection.jarak_m).toFixed(1)} m | confidence ${Math.round(detection.conf * 100)}%`;
        resultBox.append(item);
      }
      return detections;
    }

    async function detectFrame() {
      if (!detecting) return;
      if (!camera.videoWidth || !camera.videoHeight) {
        window.setTimeout(detectFrame, detectionIntervalMs);
        return;
      }
      const session = cameraSession;
      try {
        const scale = Math.min(1, 640 / camera.videoWidth);
        const snapshot = document.createElement("canvas");
        snapshot.width = Math.round(camera.videoWidth * scale);
        snapshot.height = Math.round(camera.videoHeight * scale);
        const context = snapshot.getContext("2d");
        if (!context) throw new Error("Tidak dapat menyiapkan gambar kamera.");
        context.drawImage(camera, 0, 0, snapshot.width, snapshot.height);
        const blob = await new Promise((resolve, reject) => {
          snapshot.toBlob(value => value
            ? resolve(value)
            : reject(new Error("Gagal mengambil gambar kamera.")), "image/jpeg", 0.8);
        });
        const form = new FormData();
        form.append("gambar", blob, "kamera.jpg");
        const response = await fetch("/deteksi", { method: "POST", body: form });
        const body = await response.json().catch(() => ({}));
        if (!detecting || session !== cameraSession) return;
        if (response.status === 401) {
          detecting = false;
          stream?.getTracks().forEach(track => track.stop());
          stream = null;
          camera.srcObject = null;
          stopAudio();
          setStatus("Sesi berakhir. Muat ulang halaman untuk melanjutkan.", true);
          return;
        }
        if (!response.ok) throw new Error(body.detail || `HTTP ${response.status}`);

        const detections = renderResult(body);
        const alerts = detections.filter(item => item.level !== "AMAN");
        const now = Date.now();
        if (alerts.length) {
          lastAlertAt = now;
          const top = alerts[0];
          const nextKey = `${top.kelas}:${top.arah}`;
          const nextLevel = { AMAN: 0, INFO: 1, WASPADA: 2, BAHAYA: 3 }[top.level] || 0;
          if ((nextKey !== alertKey || nextLevel > alertLevel) && now - lastSpokenAt >= 1800) {
            alertKey = nextKey;
            alertLevel = nextLevel;
            lastSpokenAt = now;
            if (body.suara) void playPlan(body.suara);
            else setStatus(`Peringatan ${top.level}: ${top.kelas} ${top.arah}.`, true);
          } else if (audio.paused) {
            setStatus(`${alerts.length} rintangan terdeteksi. Peringatan ${top.level}.`);
          }
        } else if (detections.length) {
          lastAlertAt = now;
          const top = detections[0];
          const nextKey = `${top.kelas}:${top.arah}`;
          if ((nextKey !== alertKey || alertLevel > 0) && now - lastSpokenAt >= 1800) {
            alertKey = nextKey;
            alertLevel = 0;
            lastSpokenAt = now;
            if (body.suara) void playPlan(body.suara);
          } else if (audio.paused) {
            setStatus(`${detections.length} objek terdeteksi. ${top.kelas} ${top.arah}; tetap waspada.`);
          }
        } else {
          if (now - lastAlertAt > 3500) {
            alertKey = null;
            alertLevel = 0;
          }
          if (audio.paused) {
            setStatus(detections.length
              ? `${detections.length} objek terdeteksi. Tidak ada peringatan bahaya.`
              : "Kamera aktif. Tidak ada objek terdeteksi.");
          }
        }
      } catch (error) {
        if (detecting && session === cameraSession) setStatus(`Deteksi gagal: ${error.message}`, true);
      } finally {
        if (detecting && session === cameraSession) window.setTimeout(detectFrame, detectionIntervalMs);
      }
    }

    startButton.addEventListener("click", async () => {
      if (detecting) {
        detecting = false;
        cameraSession += 1;
        stream?.getTracks().forEach(track => track.stop());
        stream = null;
        camera.srcObject = null;
        boxContext.clearRect(0, 0, boxes.width, boxes.height);
        stopAudio();
        startButton.textContent = "Aktifkan kamera belakang";
        setStatus("Kamera dimatikan.");
        return;
      }

      startButton.disabled = true;
      try {
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error("Browser perlu HTTPS dan izin kamera.");
        }
        await unlockAudio();
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } }, audio: false
        });
        camera.srcObject = stream;
        await camera.play();
        cameraSession += 1;
        detecting = true;
        startButton.textContent = "Matikan kamera";
        setStatus("Kamera aktif. Deteksi otomatis sedang berjalan.");
        void detectFrame();
      } catch (error) {
        stream?.getTracks().forEach(track => track.stop());
        stream = null;
        camera.srcObject = null;
        setStatus(`Kamera atau audio tidak dapat diaktifkan: ${error.message}`, true);
      } finally {
        startButton.disabled = false;
      }
    });

    window.addEventListener("resize", () => {
      if (detecting) renderBoxes([]);
    });
    window.addEventListener("pagehide", () => {
      detecting = false;
      cameraSession += 1;
      stream?.getTracks().forEach(track => track.stop());
    });
  </script>
</body>
</html>
