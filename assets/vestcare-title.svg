<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="judul subjudul">
  <title id="judul">VestCare - Rompi Cerdas (Stage 2)</title>
  <desc id="subjudul">Sistem peringatan rintangan untuk rompi cerdas berbasis segmentasi YOLO26n, logika fuzzy Sugeno, dan suara natural Bahasa Indonesia.</desc>
  <defs>
    <linearGradient id="latar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#250806"/>
      <stop offset="55%" stop-color="#5b140d"/>
      <stop offset="100%" stop-color="#8a2a17"/>
    </linearGradient>
    <linearGradient id="aksen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0b35a"/>
      <stop offset="100%" stop-color="#e05a3a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="220" rx="24" fill="url(#latar)"/>
  <rect x="24" y="24" width="1152" height="172" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="600" y="105" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="2">VestCare</text>
  <text x="600" y="153" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="500" fill="#f6d7c8" letter-spacing="5">ROMPI CERDAS (STAGE 2)</text>
  <rect x="510" y="178" width="180" height="4" rx="2" fill="url(#aksen)"/>
</svg>
